<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e3f2df"><title>荷受け配分計算</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:#181e1a;background:#f4f7f2;font-synthesis:none;--green:#368452;--pale:#e3f2df;--border:#d7e2d5}*{box-sizing:border-box}body{margin:0}main{max-width:520px;margin:auto;padding:0 18px 28px}header{padding:34px 6px 25px}h1{font-size:27px;letter-spacing:.035em;margin:8px 0}header p{margin:0;color:#57655b;font-size:14px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:#51785a}h2{margin:0;font-size:17px}.card{background:white;border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:0 3px 12px #243d2504}.metadata{padding:18px;display:grid;gap:16px}label{font-size:15px;font-weight:600;display:block}.optional{font-size:11px;color:#637264;background:#edf2ea;border-radius:4px;padding:3px 6px;margin-left:5px;font-weight:400}input{width:100%;min-height:48px;font:inherit;font-size:18px;border:1px solid #bccbbd;border-radius:8px;padding:10px 12px;background:#fff;color:#181e1a;margin-top:8px}input:focus{outline:3px solid #c9e9c7;border-color:#368452}input[aria-invalid=true]{border-color:#a34242}button{font:inherit;cursor:pointer;min-height:48px;border-radius:10px;font-weight:700;touch-action:manipulation}button:focus-visible{outline:3px solid #72b77b;outline-offset:3px}.receipt-head{background:var(--pale);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}.remove{width:44px;min-height:44px;border:1px solid #c0d6bc;background:#fff9;color:#45664a;font-size:24px;border-radius:50%}.fields{padding:10px 17px 17px}.field{display:grid;grid-template-columns:100px minmax(0,1fr) 24px;align-items:center;gap:8px;margin:8px 0}.field input{margin:0;text-align:right;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.unit{font-size:13px;color:#617064}.add{width:100%;border:1px solid #91ba92;background:#edf7e9;color:#326c40;margin-bottom:20px}.totals h2{background:var(--pale);padding:13px 17px}.total-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:17px 5px}.total-cell{text-align:center;padding:0 4px;min-width:0}.total-cell+div{border-left:1px solid var(--border)}.total-label{font-size:11px;color:#5a685e;margin-bottom:8px}.total-value{font-weight:700;font-size:clamp(16px,5vw,23px);overflow-wrap:anywhere}.total-value small{font-size:11px;font-weight:400;margin-left:3px}.primary{border:0;background:var(--green);color:#fff;width:100%;font-size:20px;min-height:58px;display:flex;justify-content:center;gap:18px;align-items:center;box-shadow:0 4px 12px #36845222}.primary:disabled{background:#dce7d9;color:#758271;cursor:default;box-shadow:none}.message{font-size:12px;color:#626f62;line-height:1.7;margin:0 2px 15px;min-height:20px}.result-heading{padding:35px 5px 20px}.result-heading h2{font-size:25px;margin:8px 0}.result-heading p{margin:0;white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}.person h3{background:var(--pale);margin:0;padding:15px 18px;font-size:23px;color:#111}.person h3 span{font-size:13px;font-weight:500;margin-left:10px;color:#536354}.result-row{margin:0 18px;padding:16px 0;display:grid;grid-template-columns:98px minmax(0,1fr);gap:8px;align-items:center}.result-row+.result-row{border-top:1px solid #e4eae1}.result-label{font-size:14px;font-weight:600}.result-value{text-align:right;font-size:29px;line-height:1.3;font-weight:750;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.result-value small{font-size:14px;margin-left:5px;font-weight:500}.equation{font-size:11px;color:#68736a;text-align:right;margin-top:5px;font-weight:400;overflow-wrap:anywhere}.match{color:#47754c;font-size:12px;text-align:center;line-height:1.7;margin:18px 0}#results{scroll-margin-top:10px;outline:none}footer{text-align:center;font-size:11px;color:#748174;margin-top:26px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media(max-width:350px){main{padding:0 12px}.field{grid-template-columns:88px minmax(0,1fr) 20px}.result-value{font-size:25px}}
</style></head>
<body><main><header><span class="eyebrow">RECEIVING CALCULATOR</span><h1>荷受け配分計算</h1><p>荷受けごとに入力してください</p></header>
<form id="form" novalidate><section class="card metadata"><label>品種 <span class="optional">任意</span><input id="variety" type="text" placeholder="例：青島" maxlength="80"></label><label>園地 <span class="optional">任意</span><input id="orchard" type="text" placeholder="例：山側" maxlength="80"></label></section>
<div id="receipts"></div><button type="button" id="add" class="add">＋ 荷受けを追加</button>
<section class="card totals"><h2>入力合計</h2><div id="totals"></div></section><p id="message" class="message" aria-live="polite">3項目すべてに、1以上の整数を入力してください。</p><button id="output" type="submit" class="primary" disabled>出力<span aria-hidden="true">↓</span></button></form>
<section id="results" hidden tabindex="-1"><div class="result-heading"><span class="eyebrow">ALLOCATION</span><h2>配分結果</h2><p id="result-meta"></p></div><div id="people"></div><p id="match" class="match"></p><button type="button" id="back" class="add">↑ 入力へ戻る</button></section><footer>長門 50% · 茂 45% · 大知 5%</footer></main><script>/* Integer arithmetic keeps remainder comparisons exact. */
function allocate(total) {
  if (!Number.isSafeInteger(total) || total < 2 || total > 1000000000000) throw new Error('合計は2以上、1兆以下にしてください。');
  const weights = [50,45,5];
  const values = weights.map(w => Math.floor(total*w/100));
  const remainder = weights.map(w => total*w%100);
  let left = total-values.reduce((a,b)=>a+b,0);
  const order = [0,1,2].sort((a,b)=>remainder[b]-remainder[a] || weights[a]-weights[b]);
  for (const i of order) { if (!left) break; values[i]++; left--; }
  const minimum = [1,1,total*5<=30?0:1];
  for (let i=0;i<3;i++) if(values[i]<minimum[i]) {
    const donors=[0,1,2].filter(j=>values[j]>minimum[j]).sort((a,b)=>(values[b]*100-total*weights[b])-(values[a]*100-total*weights[a]) || values[b]-values[a]);
    if(!donors.length) throw new Error('配分できません。');
    values[donors[0]]--;values[i]++;
  }
  return values;
}
if(typeof module!=='undefined') module.exports={allocate};
</script><script>const labels=['総重量','空車重量','コンテナ数'],units=['kg','kg','個'],names=['長門','茂','大知'],rates=[50,45,5];
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ja-JP',{maximumFractionDigits:2});
let nextId=0;
function addReceipt(){const id=++nextId,card=document.createElement('section');card.className='card receipt';card.innerHTML=`<div class="receipt-head"><h2></h2><button type="button" class="remove" aria-label="この荷受けを削除">−</button></div><div class="fields">${labels.map((name,i)=>`<div class="field"><label for="r${id}-${i}">${name}</label><input id="r${id}-${i}" inputmode="numeric" type="text" pattern="[0-9]*" autocomplete="off" aria-label="${name}" data-index="${i}"><span class="unit">${units[i]}</span></div>`).join('')}</div>`;card.querySelector('.remove').onclick=()=>{card.remove();if(!$('receipts').children.length)addReceipt();renumber();update()};$('receipts').append(card);renumber();update();return card;}
function renumber(){document.querySelectorAll('.receipt').forEach((card,i)=>{card.querySelector('h2').textContent=`荷受け ${i+1}`;card.querySelector('.remove').setAttribute('aria-label',`荷受け${i+1}を削除`);card.querySelectorAll('input').forEach((input,j)=>input.setAttribute('aria-label',`荷受け${i+1} ${labels[j]}`))})}
function getState(){let totals=[0,0,0],active=0,valid=true;document.querySelectorAll('.receipt').forEach(card=>{const inputs=[...card.querySelectorAll('input')],raw=inputs.map(x=>x.value.trim());if(raw.every(x=>!x)){inputs.forEach(x=>x.removeAttribute('aria-invalid'));return}active++;inputs.forEach((input,i)=>{const str=raw[i],value=Number(str),ok=/^[0-9]+$/.test(str)&&Number.isSafeInteger(value)&&value>0&&value<=1e12;input.setAttribute('aria-invalid',String(!ok));if(ok)totals[i]+=value;else valid=false})});if(totals.some(x=>x>1e12||!Number.isSafeInteger(x)))valid=false;return{totals,valid:valid&&active>0&&totals.every(x=>x>=2),active};}
function update(){const s=getState();$('output').disabled=!s.valid;$('totals').innerHTML=`<div class="total-grid">${labels.map((name,i)=>`<div class="total-cell"><div class="total-label">${name}</div><div class="total-value">${fmt(s.totals[i])}<small>${units[i]}</small></div></div>`).join('')}</div>`;$('message').textContent=s.valid?'入力が揃いました。出力できます。':s.active&&s.totals.some(x=>x===1)?'各項目の合計は2以上にしてください。':'3項目すべてに、1以上の整数を入力してください。';$('results').hidden=true;}
function scrollToEl(el){el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
$('add').onclick=()=>{const card=addReceipt();scrollToEl(card);card.querySelector('input').focus({preventScroll:true})};$('form').addEventListener('input',update);
$('form').onsubmit=e=>{e.preventDefault();const s=getState();if(!s.valid)return;const allocations=s.totals.map(allocate);$('result-meta').textContent=[$('variety').value.trim(),$('orchard').value.trim()].filter(Boolean).join(' ／ ');$('people').innerHTML=names.map((name,p)=>`<article class="card person"><h3>${name}<span>${rates[p]}%</span></h3>${labels.map((label,i)=>`<div class="result-row"><div class="result-label">${label}</div><div><div class="result-value">${fmt(allocations[i][p])}<small>${units[i]}</small></div><div class="equation">${fmt(s.totals[i])} × ${rates[p]}% ＝ ${fmt(s.totals[i]*rates[p]/100)}</div></div></div>`).join('')}</article>`).join('');$('match').textContent='✓ 3人の配分合計は、すべて入力合計と一致しています。';$('results').hidden=false;$('results').focus({preventScroll:true});scrollToEl($('results'))};$('back').onclick=()=>{scrollToEl($('form'));$('variety').focus({preventScroll:true})};addReceipt();
</script></body></html>
